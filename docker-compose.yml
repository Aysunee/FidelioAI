# Fidelio webhook stack — 3 services, compose-isolated network.
#
# Start:    docker compose --env-file .env.webhook up -d
# Stop:     docker compose down
# Logs:     docker compose logs -f
#
# The `--env-file .env.webhook` flag is REQUIRED on every compose command
# — it feeds POSTGRES_PASSWORD (and any other ${VAR}) into compose's
# variable interpolation. Without it, ${POSTGRES_PASSWORD} resolves to
# empty and postgres fails to start.
#
# .env.webhook is also volume-mounted into the backend container at
# runtime for the Node --env-file loader.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fidelio_webhook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fidelio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fidelio_signals
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidelio -d fidelio_signals"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No external port — only reachable within compose network

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fidelio_webhook_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.env.webhook:/app/.env.webhook:ro
    environment:
      # DATABASE_URL is AUTHORITATIVE here. The value in .env.webhook is
      # silently ignored at runtime because Node's --env-file loader does
      # NOT override env vars that are already set by compose. If you need
      # to change the database connection string, edit it on this line
      # (not in .env.webhook).
      DATABASE_URL: postgres://fidelio:${POSTGRES_PASSWORD}@postgres:5432/fidelio_signals
      BIND_HOST: 0.0.0.0
      PORT: 3001
    # No external port — caddy reverse-proxies through compose network

  caddy:
    image: caddy:2-alpine
    container_name: fidelio_webhook_caddy
    restart: unless-stopped
    depends_on:
      # Wait for backend to report healthy (HEALTHCHECK in server/Dockerfile
      # hits /health). Prevents Caddy returning 502s during slow boot.
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
