<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fidelio">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <title>Fidelio Screener</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-background)',
              surface: 'var(--bg-surface)',
              'surface-secondary': 'var(--bg-surface-secondary)',
              'surface-highlight': 'var(--bg-surface-highlight)',
              border: 'var(--color-border)',
              primary: 'var(--color-brand)',
              success: 'var(--color-success)',
              danger: 'var(--color-danger)',
              warning: 'var(--color-warning)',
              text: 'var(--color-text)',
              secondary: 'var(--color-text-secondary)',
            },
            borderRadius: {
              'card': 'var(--radius-card)',
              'sm-brand': 'var(--radius-sm)',
            },
            boxShadow: {
              'brand': 'var(--shadow-card)',
            },
            fontFamily: {
              sans: ['Inter', 'Roboto', 'system-ui', 'sans-serif'],
              display: ['Inter', 'Roboto', 'system-ui', 'sans-serif'], // Standardized font
              mono: ['IBM Plex Mono', 'Menlo', 'Monaco', 'monospace'], // Technical look
            },
            animation: {
              'enter': 'enter 0.2s ease-out',
            },
            keyframes: {
              enter: {
                '0%': { opacity: 0, transform: 'translateY(5px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' }
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
